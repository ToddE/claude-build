name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match VERSION in the script
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^VERSION="\([0-9.]*\)".*/\1/p' claude-build.sh | head -n 1)"
          echo "tag=$tag script=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match VERSION=$ver in claude-build.sh. Run scripts/release.sh instead of tagging by hand."; exit 1; }
      - name: Syntax check
        run: |
          bash -n claude-build.sh
          bash -n install.sh
          bash -n scripts/release.sh
      - name: Checksums
        run: sha256sum claude-build.sh install.sh LICENSE NOTICE > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "claude-build ${GITHUB_REF_NAME#v}" --generate-notes \
            claude-build.sh install.sh SHA256SUMS
