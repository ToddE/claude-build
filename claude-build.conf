# =============================================================================
# claude-build.conf: settings for ./claude-build.sh
# =============================================================================
# This file is read as shell, so keep it to KEY=value lines and ( ) arrays.
# Only run a config file you trust.
#
# Which config is used:  -c FILE, else claude-build.conf in the folder you are in,
# else the one beside the script. It must be owned by you and not writable by everyone.
# Precedence, lowest to highest:  built-in default  <  this file  <  command-line flag.
# Every setting here has a flag that overrides it. Run ./claude-build.sh -h to list them.
# Run it with flags but without -r, -b, or -o to PREVIEW the result of everything below. Nothing is started.
#
# A "relative path" below is relative to PROJECT_DIR, not to where you ran the command.
# The two exceptions are the -c and -d flags, which locate the config and the project and are
# relative to where you typed the command. This script can be run from any folder.
# Full reference: README_claude-build.md in this folder.
# =============================================================================


# -----------------------------------------------------------------------------
# WHERE THINGS ARE
# -----------------------------------------------------------------------------

# PROJECT_NAME
#   A label shown in the log and in the -s report. Has no other effect.
#   Default: "build"            Flag: none
PROJECT_NAME="inform9"

# PROJECT_DIR
#   The project's folder on this computer. The script changes into it before it does anything,
#   so you can run claude-build.sh from any folder. It must be a git repository (see REQUIRE_GIT)
#   because every task is committed there. STATE_FILE, CONTEXT_FILES, PROMPT_FILE, LOG_DIR, and
#   REDACT_FILES are all relative to this folder.
#   Use an absolute path. A relative path here is relative to the folder that holds this config file.
#   If this is empty and no -d flag is given, the script uses the folder above its own scripts/
#   folder only if that folder is a git repository. Otherwise it stops. It never uses the folder
#   you happened to run it from.
#   Default: none               Flag: -d, --project DIR   (relative to where you run the command)
#   If you move the project, change this line.
PROJECT_DIR="/home/emerson/Workspace/inform9"

# STATE_FILE
#   The file that records progress, and the only thing a project must provide. A new run reads it
#   to learn where to continue. It must start with STATUS, NEXT, and BLOCKED_REASON lines and
#   contain a Markdown task table with Id and Status columns (README_claude-build.md, section 4).
#   Stored at: PROJECT_DIR/STATE_FILE, here /home/emerson/Workspace/inform9/BUILD_STATE.md
#   It is committed with the project. Give it a path such as "docs/PROGRESS.md" to keep it elsewhere.
#   Default: "BUILD_STATE.md"  Flag: -S, --state FILE
STATE_FILE="BUILD_STATE.md"

# LOG_DIR
#   Where the script keeps its working files: build.log (all output), supervisor.log (the output
#   of a -b run), build.lock, backoff_until, failures, and the stop file. Not project history, so add it
#   to .gitignore. Use a different folder for each build you run at the same time.
#   Stored at: PROJECT_DIR/LOG_DIR, here /home/emerson/Workspace/inform9/.build/
#   Default: ".build"           Flag: -l, --log-dir DIR
LOG_DIR=".build"


# -----------------------------------------------------------------------------
# WHAT EACH RUN IS TOLD
# -----------------------------------------------------------------------------

# PROMPT
#   The instruction given to the model at the start of every run. Keep it short. The model
#   is told to read only the parts of files that the task needs.
#   Placeholders, filled in before the run:
#     {state_file}      the STATE_FILE name
#     {tasks_per_run}   the TASKS_PER_RUN number
#     {context}         a sentence listing CONTEXT_FILES, or nothing if the list is empty
#     {model} {effort}  the model and effort chosen for this run
#     {model_rule}      tells the run to stop before a task that needs a different model (added
#                       automatically at the end if your prompt does not use it)
#   Default: read the state file, continue at NEXT, do up to N tasks, update the state file and
#   commit after each task, set STATUS to blocked at a stop condition, do not deploy or push.
#   Flag: -P, --prompt TEXT     (a flag prompt replaces this one)
PROMPT='Read CLAUDE.md and {state_file}. {context} Continue the build at the NEXT task. Do up to {tasks_per_run} tasks, or stop earlier at a gate or a stop condition. {model_rule} After each task, update {state_file} and commit. If a stop condition applies, set STATUS to blocked with the reason and stop. Do not deploy and do not push.'

# PROMPT_FILE
#   A path to a text file holding the prompt, for long prompts. Same placeholders as PROMPT.
#   If set, it is used instead of PROMPT. Leave empty to use PROMPT above.
#   Relative to PROJECT_DIR.    Default: ""      Flag: -f, --prompt-file FILE
PROMPT_FILE=""

# CONTEXT_FILES
#   Files or folders the run should start reading from. They are named in the prompt through
#   {context}; nothing is loaded in advance, so listing a folder costs nothing until the run
#   opens a file in it. Relative to PROJECT_DIR. An array: ("a.md" "docs/" "more/").
#   Default: ()                 Flag: -i, --context PATH   (repeat for more; the first -i
#                               on the command line replaces this list)
CONTEXT_FILES=("planning/engineering-prompt-overview.md")


# -----------------------------------------------------------------------------
# HOW EACH RUN IS DONE
# -----------------------------------------------------------------------------

# MODEL
#   The fallback model, passed to "claude --model". Used when MODEL_FROM_STATE is 0, or for a task
#   whose Model cell in the state file is empty. Examples: sonnet, opus, haiku, or a full model id.
#   The -m flag forces this model for every run and turns MODEL_FROM_STATE off.
#   Values: a model name        Default: "sonnet"           Flag: -m, --model NAME
MODEL="sonnet"

# MODEL_FROM_STATE
#   1 = each run uses the model named in the Model column of the NEXT task in the state file. The
#       script chooses, so no model has to orchestrate. Consecutive tasks with the same model share
#       one run. When the next task names a different model, the run stops before it and the script
#       starts a new run on that model. "Sonnet (copywriter)" is read as sonnet.
#   0 = every run uses MODEL.
#   Choosing the right model once per task avoids starting low and redoing the work on a higher one.
#   Values: 1 or 0              Default: 1                  Flag: -m turns it off for that run
MODEL_FROM_STATE=1

# EFFORT
#   The fallback effort level, passed to "claude --effort": how much the model reasons before it
#   answers. Used when EFFORT_FROM_STATE is 0, or when neither the task nor EFFORT_DEFAULTS gives
#   one. Empty means the Claude Code default. Levels: low, medium, high, xhigh, max.
#   The -e flag forces this level for every run and turns EFFORT_FROM_STATE off.
#   Values: a level or ""       Default: ""                 Flag: -e, --effort LEVEL
EFFORT=""

# EFFORT_FROM_STATE
#   1 = each run uses the Effort column of the NEXT task if it has one and the model also came from
#       the state file, else the level for the model in EFFORT_DEFAULTS, else EFFORT.
#   0 = every run uses EFFORT.
#   Values: 1 or 0              Default: 1                  Flag: -e turns it off for that run
EFFORT_FROM_STATE=1

# EFFORT_DEFAULTS   (config only)
#   The effort level for each model when a task has no Effort cell. An array of "model=level".
#   Low for scripted work, medium for spec-built work, high for security and design.
#   Values: an array            Default: ("opus=high" "sonnet=medium" "haiku=low")
EFFORT_DEFAULTS=("opus=high" "sonnet=medium" "haiku=low")

# PERMISSION_MODE
#   The Claude Code permission mode for the run. "acceptEdits" accepts file edits without asking.
#   Commands still have to be on ALLOWED_TOOLS. Avoid any mode that skips all checks.
#   Default: "acceptEdits"      Flag: -M, --permission-mode MODE
PERMISSION_MODE="acceptEdits"

# ALLOWED_TOOLS
#   The only tools and commands an unattended run may use. Anything not listed is refused.
#   Entries are a tool name (Read, Edit, Write, Glob, Grep, Agent) or a command pattern such as
#   "Bash(pnpm:*)", which allows commands starting with pnpm. Deliberately left out: git push,
#   deploy commands (wrangler deploy), and anything that deletes (rm). If a run fails because
#   a command was refused, build.log says which; add it here only if it is safe.
#   Default: read, edit, write, search, and a few git and shell commands      Flag: none
ALLOWED_TOOLS=(
  "Read" "Edit" "Write" "Glob" "Grep" "Agent"
  "Bash(pnpm:*)" "Bash(node:*)" "Bash(python3:*)" "Bash(npx:*)" "Bash(ls:*)" "Bash(cat:*)" "Bash(mkdir:*)"
  "Bash(git status:*)" "Bash(git diff:*)" "Bash(git add:*)" "Bash(git commit:*)" "Bash(git log:*)"
  "Bash(wrangler dev:*)" "Bash(wrangler d1 execute:*)"
)

# EXTRA_CLAUDE_ARGS
#   Extra arguments added to every "claude" command, as an array. Example: ("--max-turns" "60").
#   Default: ()                 Flag: none
EXTRA_CLAUDE_ARGS=()

# CLAUDE_BIN
#   The command that starts Claude Code. Use a full path if cron or a timer cannot find it,
#   for example "/home/emerson/.local/bin/claude". Tests point it at a stand-in script.
#   Default: "claude"           Flag: none
CLAUDE_BIN="claude"

# TASKS_PER_RUN
#   How many tasks each run attempts. This is an instruction in the prompt, not a hard limit.
#   Fewer tasks mean smaller contexts and more frequent saves; more tasks mean fewer start-ups.
#   Default: 5                  Flag: -t, --tasks-per-run N
TASKS_PER_RUN=5

# TIMEOUT
#   The longest one run may take before it is stopped. Uses the "timeout" command's units:
#   90s, 45m, 3h. A run stopped this way counts as a failed run and triggers a backoff.
#   Default: "3h"               Flag: -T, --timeout DURATION
TIMEOUT="3h"


# -----------------------------------------------------------------------------
# TIMING
# -----------------------------------------------------------------------------

# INTERVAL
#   Seconds to wait between checks when there is nothing to do, or after a failed run (the
#   backoff below may be longer). Waiting uses no tokens.
#   Default: 1200 (20 minutes)  Flag: -w, --interval SECONDS
INTERVAL=1200

# AFTER_RUN
#   Seconds to wait after a good run before starting the next one.
#   Default: 30                 Flag: -a, --after-run SECONDS
AFTER_RUN=30

# BACKOFF_STEPS
#   Seconds to wait after the 1st, 2nd, 3rd, and every later failed run in a row, for example
#   when a usage limit is reached. A good run clears the count. The script cannot see your
#   plan's reset time, so shorten these if your limit resets sooner.
#   Default: (3600 7200 14400 21600), which is 1, 2, 4, then 6 hours      Flag: none
BACKOFF_STEPS=(3600 7200 14400 21600)


# -----------------------------------------------------------------------------
# WATCHING PROGRESS
# -----------------------------------------------------------------------------
# Progress is printed to the terminal and appended to LOG_DIR/build.log (LOG_DIR/supervisor.log
# when started with -b). Follow it with tail -f, or print the last state and the log tail with -s.

# REDACT_FILES
#   Files whose values (lines like KEY=value) are replaced with [hidden] if they appear in the log
#   lines that -s prints. Relative to PROJECT_DIR. The log file itself is not scrubbed, so keep
#   it out of git and screenshots.
#   Default: (".env.local")     Flag: none
REDACT_FILES=(".env.local")


# -----------------------------------------------------------------------------
# SAFETY
# -----------------------------------------------------------------------------

# REQUIRE_GIT
#   1 = refuse to start unless PROJECT_DIR is a git repository, so every task can be reverted.
#   0 = allow a project with no git. Not recommended.
#   Default: 1                  Flag: none
REQUIRE_GIT=1
